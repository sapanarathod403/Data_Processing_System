spring.application.name=dps-system

# H2 Database
spring.datasource.url=jdbc:h2:file:./dpsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.root=INFO
logging.file.name=logs/dps.log

# Thread Pool
dps.thread.pool.size=8

# Retry
dps.retry.max-attempts=3
dps.retry.delay-ms=5000

# Output
dps.output.path=./output


# =========================
# ACTUATOR CONFIGURATION
# =========================

management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings

management.endpoint.health.show-details=always

management.info.env.enabled=true

info.app.name=DPS System
info.app.description=Data Processing System using Spring Boot
info.app.version=1.0.0
info.app.owner=DPS Team

